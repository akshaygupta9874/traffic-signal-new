<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Traffic Signal</title>
<style>
  :root { --bg:#0e1218; --panel:#151b24; --line:#2a3445; --text:#e6e8ec; --muted:#98a1ae; --green:#2de05a; --yellow:#ffd21f; --red:#ff2d2d; --accent:#5aa7ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; padding-top: env(safe-area-inset-top); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; gap: 10px; }
  .pill { padding: 3px 12px; border-radius: 99px; font-weight: 700; border: 1px solid currentColor; }
  .meta { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .stage { position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  .zoom { position: absolute; right: 12px; top: 12px; display: grid; gap: 8px; }
  .zoom button { width: 44px; height: 44px; font-size: 22px; padding: 0; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 48px; padding: 8px 12px; }
  button:active { background: #202a3a; }
  button.g { color: var(--green); } button.y { color: var(--yellow); } button.r { color: var(--red); }
  nav { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .sheet { display: none; gap: 10px; padding-top: 4px; }
  .sheet.open { display: grid; }
  .timing { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; align-items: end; }
  label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; min-height: 44px; }
  .err { color: #ff8a8a; font-size: 12px; min-height: 1em; } .note { color: var(--yellow); font-size: 12px; }
  .legal { font-size: 11px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="pill" id="sState">GREEN</span>
    <div class="meta"><div id="sLine1">STRAIGHT &middot; 10 s</div><div id="sLine2">AUTO &middot; simulated</div></div>
  </header>
  <div class="stage">
    <canvas id="stage" aria-label="Traffic signal"></canvas>
    <div class="zoom"><button data-cmd="zoomIn" aria-label="Zoom in">+</button><button data-cmd="zoomOut" aria-label="Zoom out">&minus;</button><button data-cmd="zoomReset" aria-label="Reset zoom" style="font-size:13px">1x</button></div>
  </div>
  <nav>
    <div class="row">
      <button class="g" data-cmd="green">Green</button><button class="y" data-cmd="yellow">Yellow</button><button class="r" data-cmd="red">Red</button>
    </div>
    <div class="row">
      <button data-cmd="left" aria-label="Left">&larr;</button><button data-cmd="straight" aria-label="Straight">&uarr;</button><button data-cmd="right" aria-label="Right">&rarr;</button>
      <button data-cmd="none">None</button><button data-cmd="all">All</button>
    </div>
    <div class="row">
      <button data-cmd="pause" id="bPause">Pause</button><button data-cmd="mode" id="bMode">Manual</button><button data-cmd="reset">Reset</button><button id="bMore">More</button>
    </div>
    <div class="sheet" id="sheet">
      <form class="timing" id="timing" novalidate>
        <label>Green<input id="tG" type="number" inputmode="numeric" min="1" max="3600" value="10"></label>
        <label>Yellow<input id="tY" type="number" inputmode="numeric" min="1" max="3600" value="3"></label>
        <label>Red<input id="tR" type="number" inputmode="numeric" min="1" max="3600" value="10"></label>
        <button type="submit">Set</button>
      </form>
      <div class="err" id="tErr" role="alert"></div>
      <label>Output backend
        <select id="backend">
          <option value="simulated">Simulated</option>
          <option value="8255">8255 (virtual chip)</option>
          <option value="8255-missing">8255 missing (fallback demo)</option>
          <option value="serial">Serial protocol (log)</option>
        </select>
      </label>
      <div class="note" id="sNote"></div>
      <div class="row"><button data-cmd="off">All off</button><button data-cmd="exit">Stop</button><button data-cmd="start" id="bStart">Start</button></div>
      <p class="legal">Educational simulator. Not certified traffic-control equipment and not for use on public roads. Pinch the signal to zoom.</p>
    </div>
  </nav>
</div>
<script src="../desktop/js/core.js"></script>
<script src="../desktop/js/hardware.js"></script>
<script src="../desktop/js/renderer.js"></script>
<script src="../desktop/js/controller.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const colors = { GREEN: 'var(--green)', YELLOW: 'var(--yellow)', RED: 'var(--red)', OFF: 'var(--muted)' };
  const ctl = new Traffic.SignalController($('stage'), { onChange: render });
  ctl.bindCommands(document);
  ctl.attachGestures($('stage'));
  ctl.attachKeyboard(window);

  function render(s) {
    const p = $('sState'); p.textContent = s.state; p.style.color = colors[s.state];
    $('sLine1').textContent = s.direction + (s.stopped ? '' : ' · ' + s.remaining + ' s') + ' · ' + s.zoom.toFixed(2) + 'x';
    $('sLine2').textContent = (s.stopped ? 'STOPPED' : s.mode + (s.paused ? ' (paused)' : '')) + ' · ' + s.backend;
    $('bPause').textContent = s.paused ? 'Resume' : 'Pause';
    $('bMode').textContent = s.mode === 'AUTO' ? 'Manual' : 'Auto';
    $('sNote').textContent = s.message;
    if (document.activeElement.tagName !== 'INPUT') { $('tG').value = s.timings.green; $('tY').value = s.timings.yellow; $('tR').value = s.timings.red; }
    if ($('backend').value !== s.requestedBackend) $('backend').value = s.requestedBackend;
  }
  $('bMore').addEventListener('click', () => $('sheet').classList.toggle('open'));
  $('timing').addEventListener('submit', (ev) => {
    ev.preventDefault();
    $('tErr').textContent = ctl.setTimings({ green: Number($('tG').value), yellow: Number($('tY').value), red: Number($('tR').value) });
  });
  $('backend').addEventListener('change', (ev) => ctl.setBackend(ev.target.value));
  ctl.start();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
