# DOSBox settings for the networked traffic signal.
# Used by start.bat / start.sh:   dosbox -conf dosbox-traffic.conf ...
# COM1 becomes a TCP server on port 5000; the relay (node relay/server.js) connects to it.

[cpu]
cycles=max

[serial]
# No "server:" => DOSBox LISTENS on the port. transparent:1 = raw bytes (no telnet/handshake).
# txdelay/rxdelay are in milliseconds; keep them small so commands and state lines are not held back.
serial1=nullmodem port:5000 transparent:1 txdelay:1 rxdelay:1
